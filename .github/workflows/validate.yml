name: Validate game and model
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run simulate:smoke
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: model-smoke-results
          path: modelling/results/smoke/

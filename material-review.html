<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>High Roller · Material study</title></head><body><main class="material-study"><header><div><span class="study-kicker">HIGH ROLLER / MATERIAL STUDY 02</span><h1>Gold & foil.</h1></div><span class="study-state">DESIGN PREVIEW</span></header><section class="sample-row" aria-label="Dice finish comparison"></section><section class="pack-study"><div><span class="study-kicker">THE SAME LIGHT ACROSS THE TABLE</span><h2>Foil reflections</h2><p>Broad highlights travel across each surface.<br>Gold stays warm. Shiny shifts through pearl, lilac and mint.</p><button id="tilt-materials">Tilt the dice</button></div><div class="foil-shelf"><button class="foil-pack"><span class="foil-art number-art">3⁺</span><b>Count Me In</b><small>Match level token</small><em>4 ●</em></button><button class="foil-pack foil-1"><span class="foil-art">✧</span><b>Lucky Dip</b><small>Special die token</small><em>5 ●</em></button></div></section><footer><span>Live prototype materials · CSS 3D fallback</span><span>Gold: +1 coin &nbsp; / &nbsp; Shiny: ×1.5 Mult</span></footer></main><script type="module">
import '@fontsource/dm-sans/latin-400.css';import '@fontsource/dm-sans/latin-600.css';import '@fontsource/space-grotesk/latin-500.css';import './style.css';import {CSSBoard} from './css-board.js';
const samples=[{label:'STANDARD',name:'Soft bevel',note:'Light on the outer shape',die:{n:5}},{label:'GOLD',name:'Brushed gold',note:'Gold body · dark inset pips',die:{n:5,gold:true}},{label:'SHINY',name:'Iridescent foil',note:'Pip colour under a shifting sheen',die:{n:5,shiny:true}}];
const host=document.querySelector('.sample-row');host.innerHTML=samples.map((s,i)=>`<article><div class="sample-label">${s.label}</div><div class="sample-stage"><div class="sample-die ${s.die.gold?'is-gold':''} ${s.die.shiny?'is-shiny':''}" style="--half:68px;--angle:${[-7,5,-4][i]}deg"><div class="cube">${CSSBoard.prototype.faces({...s.die,special:null})}</div></div></div><h2>${s.name}</h2><p>${s.note}</p></article>`).join('');
let tilt=0;document.querySelector('#tilt-materials').onclick=()=>{tilt=(tilt+1)%3;document.querySelector('.material-study').dataset.tilt=tilt;};
</script><style>
html,body{height:auto!important;overflow:auto!important;display:block!important;background:#201c29}body:before,body:after{display:none}.material-study{width:1080px;box-sizing:border-box;margin:0 auto;padding:38px 44px 26px;color:#f2e9dc}.material-study header{padding:0;display:flex;justify-content:space-between;align-items:center;margin:0 0 35px}.study-kicker{font:600 10px 'DM Sans';letter-spacing:2px;color:#b7a2ce}.material-study h1{font:500 36px 'Space Grotesk';letter-spacing:-1px;margin:8px 0 0}.study-state{color:#beaacc;font-size:9px;letter-spacing:1.5px;padding:9px 11px;border:1px solid #51435c;border-radius:30px}.sample-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.sample-row article{background:#2d2537;border:1px solid #4a3e54;border-radius:15px;min-height:327px;padding:22px;text-align:center}.sample-label{font-size:10px;font-weight:700;letter-spacing:2px;color:#cab5dd}.sample-stage{height:211px;display:grid;place-items:center}.sample-die{width:136px;height:136px;position:relative;perspective:700px}.sample-die .cube{left:0;top:0;width:100%;height:100%;transform:rotateX(8deg) rotateY(-12deg) rotateZ(var(--angle));transition:transform .8s ease}.sample-row h2{font:500 21px 'Space Grotesk';margin:0 0 8px;letter-spacing:-.5px}.sample-row p{font-size:11px;color:#bcaec5;margin:0}.pack-study{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:30px 4px 20px}.pack-study h2{font:500 25px 'Space Grotesk';margin:9px 0}.pack-study p{font:12px/1.7 'DM Sans';color:#bcaec5}.pack-study .foil-shelf{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 6px}.pack-study .foil-pack{min-height:137px;grid-template-columns:35px 1fr}.pack-study .foil-art{font-size:36px}#tilt-materials{font:500 11px 'DM Sans';background:#493955;border:1px solid #746084;border-radius:7px;padding:9px 15px;color:#e9dbee;margin-top:3px}.material-study footer{display:flex;justify-content:space-between;padding:17px 0 0;margin:0;border-top:1px solid #493c53;font:10px 'DM Sans';color:#9f8fab}.material-study[data-tilt="1"] .cube{transform:rotateX(-8deg) rotateY(18deg) rotateZ(3deg)}.material-study[data-tilt="2"] .cube{transform:rotateX(21deg) rotateY(-26deg) rotateZ(-8deg)}
</style></body></html>

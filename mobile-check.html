<!doctype html><html><head><title>Mobile viewport check</title><style>body{margin:0;background:#0c1119;display:flex;justify-content:center;align-items:flex-start}iframe{border:0;width:390px;height:844px}</style></head><body><iframe title="Mobile playtest" src="/"></iframe><script>const q=new URLSearchParams(location.search),f=document.querySelector('iframe');for(const [key,property] of [['w','width'],['h','height']]){const v=Number(q.get(key));if(v>=280&&v<=1200)f.style[property]=v+'px';}</script></body></html>
